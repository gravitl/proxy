# Create a version tag and GitHub Release for the proxy Go module.
# Run from Actions → Release → Run workflow (typically on develop or master).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v0.1.0 or 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Need write access to push the tag back to the repo.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize version
        id: ver
        run: |
          set -euo pipefail
          RAW="${{ inputs.version }}"
          RAW="${RAW#v}"
          if [[ ! "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${{ inputs.version }} (expected semver like v0.1.0)"
            exit 1
          fi
          TAG="v${RAW}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using tag ${TAG}"

      - name: Ensure tag does not already exist
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on origin"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -count=1

      - name: Create and push tag
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          ARGS=(release create "$TAG"
            --title "$TAG"
            --generate-notes
            --target "${{ github.sha }}"
          )
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh "${ARGS[@]}"
